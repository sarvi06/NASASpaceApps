# Runs the offline tests on every push and pull request to main.
# "Offline" = everything not marked `live` (see pytest.ini); the only download is the
# FAO EcoCrop table (~1 MB), fetched once by the tests that need it.

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:      # lets you run it by hand from the Actions tab

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The GUI tests build tkinter windows, which need a display: xvfb provides a virtual one.
      - name: Run the offline tests
        run: xvfb-run -a python -m pytest -m "not live" -q
